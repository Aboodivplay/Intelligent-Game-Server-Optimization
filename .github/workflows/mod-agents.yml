name: Forge and Fabric agents
on:
  push:
    paths: ['mod-agent/**', '.github/workflows/mod-agents.yml']
  pull_request:
    paths: ['mod-agent/**', '.github/workflows/mod-agents.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          targets = json.load(open("mod-agent/targets.json"))
          rows = [{"loader": loader, "game": game, "jdk": 25 if loader == "fabric" else cfg["java"]} for game,cfg in targets.items() for loader in ("forge","fabric") if loader == "fabric" or cfg["forge"]]
          print("matrix=" + json.dumps({"include": rows}))
          PY

  build:
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Build the dedicated server mod
        run: python3 mod-agent/build.py ${{ matrix.loader }} ${{ matrix.game }} --out dist
      - name: Verify queued delivery
        run: |
          javac -d "$RUNNER_TEMP/igso-check" mod-agent/common/Delivery.java mod-agent/test/DeliveryCheck.java
          java -cp "$RUNNER_TEMP/igso-check" edu.petra.igso.mods.DeliveryCheck
      - uses: actions/upload-artifact@v4
        with:
          name: igso-${{ matrix.loader }}-${{ matrix.game }}
          path: dist/*

  package:
    name: Prepare verified dashboard downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: igso-*
          path: downloads
          merge-multiple: true
      - name: Record the tested JARs for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in downloads/*.jar downloads/*.zip; do
            sha=$(jq -n --arg content "$(base64 -w0 "$file")" '{content:$content,encoding:"base64"}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')
            echo "mods/$(basename "$file") $sha"
          done
