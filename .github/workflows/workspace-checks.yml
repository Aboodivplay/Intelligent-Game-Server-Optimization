name: Workspace checks
on:
  push:
    branches: [main]
    paths: ['*.js', '*.html', '*.css', 'assets/minecraft/**', 'tests/**', '.github/workflows/workspace-checks.yml']
  pull_request:
    paths: ['*.js', '*.html', '*.css', 'assets/minecraft/**', 'tests/**', '.github/workflows/workspace-checks.yml']

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/session.test.mjs tests/audit.test.mjs
      - name: Install browser for tests
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check desktop and mobile workspaces
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/igso-web.log 2>&1 &
          node tests/workspace-browser.mjs
